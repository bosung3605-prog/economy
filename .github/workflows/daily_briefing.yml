name: 매일 아침 경제 브리핑

on:
  # 자동 발송 일시 중지 — 재개 시 아래 schedule 3줄 주석 해제
  # schedule:
  #   - cron: '30 21 * * *'   # 21:30 UTC 트리거, 워크플로우에서 22:00 UTC(07:00 KST)까지 대기
  workflow_dispatch:         # 수동 실행 (테스트용)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write            # docs/ 커밋을 위해 필요

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 07:00 KST까지 대기 (cron 지연 보정)
        if: github.event_name == 'schedule'
        run: |
          target=$(date -u -d "$(date -u +'%Y-%m-%d') 22:00:00" +%s)
          now=$(date -u +%s)
          if [ $now -lt $target ]; then
            wait_sec=$((target - now))
            echo "대기: ${wait_sec}초 후 07:00 KST 도달"
            sleep $wait_sec
          else
            echo "이미 07:00 KST 지남, 즉시 진행"
          fi

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 경제 브리핑 생성 및 발송
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
        run: python src/main.py

      - name: GitHub Pages용 HTML 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "브리핑 업데이트: $(date +'%Y-%m-%d %H:%M KST')"
          git pull origin main --rebase
          git push
